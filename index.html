<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>わた道手帳｜Seasonal Monthly Enhancement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Maru+Gothic:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f3;
  --paper:#fffdfb;
  --paper2:#fff8f4;
  --ink:#514744;
  --muted:#8f817c;
  --line:#eadbd4;
  --blush:#f2e4de;
  --blush2:#f8efea;
  --gold:#b59a66;
  --accent:#c9a29c;
  --deep:#6f5c56;
  --shadow:0 10px 28px rgba(91,69,59,.055);
  --navH:82px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcf9f7,#f8f1ec);color:var(--ink)}
body{
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  letter-spacing:.015em;
}
button,input,textarea{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid #d5b1aa;
  outline-offset:2px;
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:env(safe-area-inset-top) 16px calc(var(--navH) + 42px + env(safe-area-inset-bottom));
}
.view{display:none}
.view.active{display:block}

.planner-hero,.astro-hero{
  position:relative;
  text-align:center;
  padding:34px 12px 18px;
}
.planner-kicker,.astro-brand{
  font-family:"Cormorant Garamond",Georgia,serif;
  color:var(--gold);
  letter-spacing:.18em;
  font-size:13px;
  font-weight:600;
}
.logo-home{
  border:0;
  background:transparent;
  padding:4px 8px;
  margin:0 auto;
  display:inline-block;
  cursor:pointer;
  color:inherit;
}
.logo-home:active{opacity:.72}
.planner-title{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:34px;
  line-height:1.05;
  color:#5e504b;
  margin:6px 0 6px;
}
.planner-sub,.astro-tagline{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em;
}
.astro-home{
  border:0;background:transparent;padding:4px 8px;margin:5px auto 6px;display:block;
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:28px;
  color:#8c7b75;letter-spacing:.05em;cursor:pointer
}

/* ─────────────────────────────────────────
   SEASONAL MONTHLY ENHANCEMENT
   9月: cosmos / 10月: kinmokusei / 11月: momiji
   ───────────────────────────────────────── */
.seasonal-decoration{
  position:absolute;
  top:18px;
  width:88px;
  height:66px;
  opacity:.48;
  pointer-events:none;
  transform-origin:50% 85%;
  z-index:0;
}
.seasonal-decoration svg{width:100%;height:100%;display:block;overflow:visible}
.seasonal-left{left:-6px;animation:seasonSwayL 5.1s ease-in-out infinite}
.seasonal-right{right:-6px;transform:scaleX(-1);animation:seasonSwayR 6.0s ease-in-out .8s infinite}
.planner-hero>*:not(.seasonal-decoration),
.astro-hero>*:not(.seasonal-decoration){position:relative;z-index:1}

@keyframes seasonSwayL{
  0%,100%{transform:translate(0,0) rotate(-2.5deg)}
  38%{transform:translate(4px,2px) rotate(3deg)}
  72%{transform:translate(1px,5px) rotate(-1deg)}
}
@keyframes seasonSwayR{
  0%,100%{transform:scaleX(-1) translate(0,0) rotate(-2deg)}
  42%{transform:scaleX(-1) translate(4px,3px) rotate(3deg)}
  76%{transform:scaleX(-1) translate(1px,5px) rotate(-1deg)}
}

.season-particle-layer{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.season-particle{
  position:absolute;
  top:-24px;
  width:10px;
  height:10px;
  opacity:.24;
  will-change:transform;
}


/* 9月 コスモス：小さな花/まとまった花弁 */
body[data-season="cosmos"] .season-particle{
  width:14px;height:14px;
  background:transparent;
  opacity:.36;
}
body[data-season="cosmos"] .season-particle::before{
  content:"";
  position:absolute;inset:1px;
  background:
    radial-gradient(circle at 50% 50%, #b9945f 0 12%, transparent 13%),
    radial-gradient(ellipse at 50% 15%, rgba(205,133,148,.95) 0 22%, transparent 23%),
    radial-gradient(ellipse at 85% 50%, rgba(214,148,160,.9) 0 22%, transparent 23%),
    radial-gradient(ellipse at 50% 85%, rgba(225,167,177,.9) 0 22%, transparent 23%),
    radial-gradient(ellipse at 15% 50%, rgba(212,143,157,.9) 0 22%, transparent 23%);
  border-radius:50%;
}
body[data-season="cosmos"] .season-particle:nth-child(even){
  width:11px;height:11px;opacity:.33;
}

/* 10月 金木犀：四弁花 */
body[data-season="kinmokusei"] .season-particle{
  width:11px;height:11px;
  background:transparent;
  opacity:.38;
}
body[data-season="kinmokusei"] .season-particle::before{
  content:"";
  position:absolute;left:4px;top:0;width:3px;height:11px;
  border-radius:60%;
  background:#d9a24c;
  box-shadow:0 0 0 .3px rgba(188,133,54,.25);
}
body[data-season="kinmokusei"] .season-particle::after{
  content:"";
  position:absolute;left:4px;top:0;width:3px;height:11px;
  border-radius:60%;
  background:#e1b266;
  transform:rotate(90deg);
  transform-origin:50% 50%;
}

/* 11月 紅葉：切れ込みのある葉 */
body[data-season="momiji"] .season-particle{
  width:14px;height:15px;
  background:#a86658;
  opacity:.36;
  clip-path:polygon(50% 0,60% 24%,78% 10%,73% 34%,100% 30%,80% 50%,96% 65%,69% 64%,63% 100%,50% 73%,37% 100%,31% 64%,4% 65%,20% 50%,0 30%,27% 34%,22% 10%,40% 24%);
}
body[data-season="momiji"] .season-particle:nth-child(even){
  width:11px;height:12px;background:#bd835d;opacity:.34;
}

/* 12月 雪：丸雪と小さな雪結晶 */
body[data-season="winter"] .season-particle{
  width:9px;height:9px;
  border-radius:50%;
  background:rgba(171,185,194,.58);
  opacity:.38;
  box-shadow:0 0 0 1px rgba(255,255,255,.45) inset;
}
body[data-season="winter"] .season-particle:nth-child(2n){
  width:12px;height:12px;
  background:linear-gradient(90deg,transparent 47%,rgba(151,169,180,.68) 48% 52%,transparent 53%);
  border-radius:0;
}
body[data-season="winter"] .season-particle:nth-child(2n)::before,
body[data-season="winter"] .season-particle:nth-child(2n)::after{
  content:"";
  position:absolute;left:5px;top:0;width:1px;height:12px;
  background:rgba(151,169,180,.68);
  border-radius:1px;
}
body[data-season="winter"] .season-particle:nth-child(2n)::after{transform:rotate(60deg)}
body[data-season="winter"] .season-particle:nth-child(2n){
  box-shadow:inset 0 0 0 0 transparent;
}
body[data-season="winter"] .season-particle:nth-child(2n) span{display:none}

/* その他 */
body[data-season="neutral"] .season-particle{
  width:5px;height:5px;border-radius:50%;
  background:rgba(170,151,141,.20);
  opacity:.18;
}

.season-particle.p1{left:8%;animation:seasonFall1 13s linear infinite}
.season-particle.p2{left:27%;animation:seasonFall2 17s linear 2.8s infinite}
.season-particle.p3{left:54%;animation:seasonFall3 15s linear 5.2s infinite}
.season-particle.p4{left:75%;animation:seasonFall4 18s linear 1.5s infinite}
.season-particle.p5{left:91%;animation:seasonFall5 14s linear 7.1s infinite}
body[data-season="winter"] .season-particle.p1{animation-duration:18s}
body[data-season="winter"] .season-particle.p2{animation-duration:22s}
body[data-season="winter"] .season-particle.p3{animation-duration:20s}
body[data-season="winter"] .season-particle.p4{animation-duration:24s}
body[data-season="winter"] .season-particle.p5{animation-duration:19s}

@keyframes seasonFall1{
  0%{transform:translate(0,-7vh) rotate(10deg)}
  32%{transform:translate(22px,31vh) rotate(90deg)}
  66%{transform:translate(-10px,67vh) rotate(178deg)}
  100%{transform:translate(18px,108vh) rotate(270deg)}
}
@keyframes seasonFall2{
  0%{transform:translate(0,-8vh) rotate(25deg)}
  36%{transform:translate(-24px,35vh) rotate(118deg)}
  71%{transform:translate(16px,72vh) rotate(211deg)}
  100%{transform:translate(-10px,108vh) rotate(302deg)}
}
@keyframes seasonFall3{
  0%{transform:translate(0,-6vh) rotate(0deg)}
  29%{transform:translate(17px,29vh) rotate(78deg)}
  63%{transform:translate(-18px,64vh) rotate(168deg)}
  100%{transform:translate(8px,108vh) rotate(263deg)}
}
@keyframes seasonFall4{
  0%{transform:translate(0,-7vh) rotate(20deg)}
  34%{transform:translate(-18px,32vh) rotate(107deg)}
  69%{transform:translate(22px,70vh) rotate(201deg)}
  100%{transform:translate(-14px,108vh) rotate(294deg)}
}
@keyframes seasonFall5{
  0%{transform:translate(0,-10vh) rotate(46deg)}
  39%{transform:translate(-20px,38vh) rotate(135deg)}
  74%{transform:translate(14px,75vh) rotate(219deg)}
  100%{transform:translate(-8px,108vh) rotate(311deg)}
}

.app,.nav,.modal{position:relative;z-index:1}
.nav,.modal{position:fixed}

@media (prefers-reduced-motion: reduce){
  .seasonal-decoration,
  .season-particle{animation:none!important}
  .season-particle{
    top:auto;
    bottom:10%;
    opacity:.16;
  }
}

/* theme variables */
body[data-season="cosmos"]{
  --season-base:#fbf7f2;
  --season-accent:#cfa7a3;
  --season-soft:#f7ebe7;
  --season-leaf:#aaa28f;
}
body[data-season="kinmokusei"]{
  --season-base:#fbf7ee;
  --season-accent:#d8aa62;
  --season-soft:#faf0dc;
  --season-leaf:#99a186;
}
body[data-season="momiji"]{
  --season-base:#f8f3ee;
  --season-accent:#aa7465;
  --season-soft:#f2e5df;
  --season-leaf:#94816f;
}
body[data-season="winter"]{
  --season-base:#faf7f3;
  --season-accent:#aab6bf;
  --season-soft:#eef2f4;
  --season-leaf:#9a958f;
}
body[data-season="neutral"]{
  --season-base:#fbf7f3;
  --season-accent:#c9a29c;
  --season-soft:#f6ece7;
  --season-leaf:#a99a92;
}
html,body{
  background:linear-gradient(180deg,var(--season-base,#fbf7f3),#f8f1ec);
  transition:background .45s ease;
}
.month-head button{
  transition:border-color .35s ease, background .35s ease, color .35s ease;
}
.month-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 15px
}
.month-head button{
  width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:16px;
  font-size:22px;color:#7b6862;box-shadow:0 4px 12px rgba(90,70,60,.03)
}
.month-title{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:28px;font-weight:500;color:#5a4e4a
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
  width:100%;
  min-width:0;
}
.dow{
  min-width:0;
  text-align:center;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:11px;
  letter-spacing:.08em;
  color:var(--muted);
  padding:5px 0 8px;
}
.dow.sun{color:#b58a86}
.dow.sat{color:#91a6ac}

.day{
  min-width:0;
  width:100%;
  height:76px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  padding:6px 2px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(92,73,64,.02);
}
.day.off{
  opacity:.25;
  background:transparent;
  border-color:transparent;
  box-shadow:none;
  cursor:default;
}
.day .num{
  flex:0 0 auto;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:14px;
  line-height:1;
  font-weight:600;
  color:var(--ink);
}
.day.sun{background:#fff3f2;border-color:#f1d9d6}
.day.sat{background:#f2f6f7;border-color:#dce8ea}
.day.sun .num{color:#b58a86}
.day.sat .num{color:#91a6ac}

.day.holiday,
.day.holiday.sat,
.day.holiday.sun{
  background:#fff3f2;
  border-color:#f1d9d6;
}
.day.holiday .num{color:#b58a86}

.day.today{outline:1.5px solid #d4b1aa;outline-offset:-1px}
.day.sun.today,
.day.holiday.today{background:#fff1f0}
.day.sat.today:not(.holiday){background:#eef5f7}
.day.today:not(.sun):not(.sat):not(.holiday){background:#fff9f7}

.day.selected{
  border-color:#d5b0a9;
  box-shadow:0 5px 14px rgba(121,91,80,.09);
}
.day.sun.selected,
.day.holiday.selected{background:#fdebea}
.day.sat.selected:not(.holiday){background:#eaf3f5}
.day.selected:not(.sun):not(.sat):not(.holiday){background:#fff4ef}

.day-meta{
  min-width:0;
  width:100%;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:2px;
  margin-top:4px;
  overflow:hidden;
  pointer-events:none;
}
.holiday-name{
  min-width:0;
  width:100%;
  min-height:18px;
  padding:0 1px;
  color:#b58a86;
  font-size:6.4px;
  font-weight:500;
  line-height:1.08;
  text-align:center;
  overflow-wrap:anywhere;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.moon-phase{
  flex:0 0 auto;
  min-height:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9c8f88;
}
.moon-svg{
  width:11px;
  height:11px;
  display:block;
}
.moon-svg .outline{
  stroke:#9c8f88;
  stroke-width:1.15;
  fill:none;
}
.moon-svg .softfill{fill:#b2a08d;opacity:.62}
.moon-svg .maskfill{fill:var(--season-base,#fbf7f3)}
.day .dots{
  flex:0 0 6px;
  min-height:6px;
  margin-top:1px;
  display:flex;
  gap:3px;
  align-items:center;
  justify-content:center;
}
.day .dot{
  width:5px;height:5px;border-radius:50%;
  background:#c7a39a;
}
.day .theme-mark{
  flex:0 0 7px;
  min-height:7px;
  max-width:100%;
  margin-top:1px;
  font-size:5.8px;
  line-height:1;
  color:#9d8b84;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}
.day:active{transform:scale(.98)}

.section-head{margin:4px 2px 14px}
.eyebrow{
  font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold);
  letter-spacing:.13em;font-size:13px;font-weight:600
}
.screen-title{
  font-family:"Cormorant Garamond","Zen Maru Gothic",Georgia,serif;
  font-size:32px;line-height:1.08;font-weight:500;margin:4px 0 3px;color:#594d49
}
.screen-sub{font-size:12px;color:var(--muted)}

.self-peek{
  width:100%;border:1px solid #ead8d1;background:linear-gradient(180deg,#fffaf7,#fff6f1);
  border-radius:22px;padding:16px;text-align:left;box-shadow:var(--shadow);margin:12px 0 18px
}
.self-peek .label{
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--gold);letter-spacing:.10em;font-size:12px;font-weight:500
}
.self-peek .theme{
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  font-size:23px;line-height:1.55;color:#5d4f49;margin:5px 0 3px;font-weight:400
}
.self-peek .go{
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  font-size:11px;color:#8f7c75;font-weight:400
}

.timeline{
  position:relative;border-top:1px solid var(--line);margin-top:10px
}
.hour-row{
  position:relative;display:grid;grid-template-columns:54px 1fr;min-height:74px;
  border-bottom:1px solid #eee4df
}
.hour-label{
  padding-top:9px;font-family:"Cormorant Garamond",Georgia,serif;font-size:12px;color:#9a8b85
}
.hour-space{position:relative}
.event-card{
  position:absolute;left:4px;right:4px;z-index:4;border:1px solid #dfc7bf;background:#fff7f3;
  border-radius:13px;padding:8px 10px;box-shadow:0 5px 14px rgba(86,63,55,.05);
  text-align:left;overflow:hidden;cursor:pointer
}
.event-card b{display:block;font-size:12px;color:#655650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-card small{font-size:10px;color:#927f78}
.daily-note{
  margin:14px 0 6px;padding:13px 14px;border-radius:16px;border:1px dashed #dfcfc7;
  color:#7f716c;font-size:11px;line-height:1.7
}

.card{
  background:rgba(255,253,251,.96);border:1px solid var(--line);border-radius:22px;
  padding:18px;margin:12px 0;box-shadow:var(--shadow)
}
.card-label,.detail b{
  display:block;font-family:"Cormorant Garamond","Zen Maru Gothic",serif;
  letter-spacing:.10em;font-size:12px;font-weight:600;color:var(--gold);margin-bottom:7px
}
.astro-theme{
  font-family:"Cormorant Garamond","Zen Maru Gothic",Georgia,serif;
  font-size:29px;line-height:1.45;color:#5f504b;margin:2px 0 7px
}
.body-copy{font-size:14px;line-height:1.9;color:#5f5754;margin:0}
.action-card{
  background:#fff8f4;border:1px solid #ead8d0;border-radius:18px;padding:15px;margin:10px 0
}
.action-card strong{
  display:block;font-family:"Cormorant Garamond","Zen Maru Gothic",serif;
  color:#9a7e74;letter-spacing:.08em;font-size:12px;margin-bottom:7px
}
.action-main{font-size:16px;line-height:1.7;color:#5f504b}
.category-list{display:grid;gap:10px;margin-top:16px}
.category-btn{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px 16px;
  display:flex;align-items:center;justify-content:space-between;color:var(--ink);text-align:left
}
.category-name{display:flex;flex-direction:column;gap:2px}
.category-name b{font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold);font-size:13px;letter-spacing:.10em}
.category-name span{font-size:13px}
.chev{font-family:Georgia,serif;color:#b69b91;font-size:22px}
.detail-stack{display:grid;gap:10px}
.detail{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px
}
.detail p{font-size:14px;line-height:1.85;margin:0;color:#5f5754}
.healthcare{
  background:#fff5ef;border:1px solid #e7cec4;border-radius:18px;padding:16px
}
.healthcare .big{font-size:18px;color:#5f504b;line-height:1.6}
.reason{margin:14px 0 8px;border:1px dashed #dccbc1;border-radius:16px;background:#f8f1ec;overflow:hidden}
.reason summary{cursor:pointer;padding:13px 15px;list-style:none;font-size:12px;color:#765f5a}
.reason summary::-webkit-details-marker{display:none}
.reason summary::after{content:"＋";float:right;color:#aa8f86}
.reason[open] summary::after{content:"−"}
.reason-body{border-top:1px dashed #dccbc1;padding:12px 15px 14px;font-size:12px;line-height:1.8;color:#736966}
.sample-note{margin-top:8px;font-size:10px;color:#958882;line-height:1.65}
.back-btn{
  width:100%;border:1px solid var(--line);background:#fffaf8;color:#765f5a;border-radius:16px;
  padding:13px;margin-top:10px
}

.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,252,249,.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))
}
.nav-inner{max-width:520px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav button{
  min-height:58px;border:0;background:transparent;color:var(--muted);border-radius:16px;
  padding:8px 5px;font-size:11px;letter-spacing:.05em
}
.nav button.active{background:var(--blush);color:var(--deep)}
.nav small{display:block;font-size:9px;margin-top:2px;opacity:.8}
.nav .plus{font-size:20px;line-height:1}

.modal{
  position:fixed;inset:0;z-index:60;background:rgba(66,52,47,.28);
  display:none;align-items:flex-end;justify-content:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom))
}

function applySeasonTheme(monthIndex){
  const monthNumber=monthIndex+1;
  const theme=MONTH_THEMES[monthNumber] || NEUTRAL_THEME;
  document.body.dataset.season=theme.name;
  document.documentElement.style.setProperty("--season-base",theme.base);
  document.documentElement.style.setProperty("--season-accent",theme.accent);
  document.documentElement.style.setProperty("--season-leaf",theme.leaf);
  document.querySelectorAll(".seasonal-decoration").forEach(el=>{
    el.innerHTML=seasonalSvg(theme.name);
  });
}

function moonIconSvg(phase){
  const common=`viewBox="0 0 16 16" class="moon-svg" aria-hidden="true" focusable="false"`;
  if(phase==="full"){
    return `<svg ${common}><circle class="outline" cx="8" cy="8" r="5.2"/></svg>`;
  }
  if(phase==="new"){
    return `<svg ${common}><circle class="outline" cx="8" cy="8" r="5.2"/><circle class="softfill" cx="8" cy="8" r="3.9"/></svg>`;
  }
  if(phase==="first"){
    return `<svg ${common}><circle class="outline" cx="8" cy="8" r="5.2"/><path class="softfill" d="M8 2.8a5.2 5.2 0 0 1 0 10.4z"/></svg>`;
  }
  if(phase==="last"){
    return `<svg ${common}><circle class="outline" cx="8" cy="8" r="5.2"/><path class="softfill" d="M8 2.8a5.2 5.2 0 0 0 0 10.4z"/></svg>`;
  }
  return "";
}

const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
const weekdayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const $=id=>document.getElementById(id);

let displayMonth=new Date(2026,8,1);
let selectedDate=new Date(2026,8,5);
let events=loadEvents();

function iso(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseDateOnly(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(y,m-1,d);
}
function selectedData(){ return sampleData[iso(selectedDate)] || genericSample; }
function loadEvents(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(e){return []}
}
function saveEvents(){ localStorage.setItem(STORE_KEY,JSON.stringify(events)); }

function showView(id){
  applySeasonTheme(id==="monthlyView" ? displayMonth.getMonth() : selectedDate.getMonth());
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $(id).classList.add("active");
  $("navMonth").classList.toggle("active",id==="monthlyView");
  $("navToday").classList.toggle("active",id==="todayView"||id==="detailView");
  window.scrollTo({top:0,behavior:"smooth"});
}
function goMonth(){
  displayMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  renderCalendar();
  showView("monthlyView");
}
function formatDateLine(d){
  return `${monthNames[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")} · ${weekdayNames[d.getDay()]}`;
}
function renderCalendar(){
  applySeasonTheme(displayMonth.getMonth());
  $("monthTitle").textContent=`${monthNames[displayMonth.getMonth()]} ${displayMonth.getFullYear()}`;
  const cal=$("calendar"); cal.innerHTML="";
  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach((x,idx)=>{
    const el=document.createElement("div");
    el.className="dow"+(idx===0?" sun":idx===6?" sat":"");
    el.textContent=x;
    cal.appendChild(el);
  });
  const y=displayMonth.getFullYear(),m=displayMonth.getMonth();
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const now=new Date();
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const btn=document.createElement("button");
    btn.type="button"; btn.className="day";
    const inMonth=d.getMonth()===m;
    if(!inMonth) btn.classList.add("off");
    if(d.getDay()===0) btn.classList.add("sun");
    if(d.getDay()===6) btn.classList.add("sat");
    if(d.toDateString()===now.toDateString()) btn.classList.add("today");
    if(d.toDateString()===selectedDate.toDateString()) btn.classList.add("selected");
    const dateKey=iso(d);
    const hasEvent=events.some(e=>e.date===dateKey);
    const isSample=dateKey==="2026-09-05";
    const holiday=HOLIDAYS[dateKey] || "";
    const moon=MOON_PHASES[dateKey] || null;
    if(holiday) btn.classList.add("holiday");

    const holidayHtml=holiday
      ? `<span class="holiday-name">${escapeHtml(holiday)}</span>`
      : `<span class="holiday-name"></span>`;

    const moonName=moon
      ? ({new:"新月",first:"上弦",full:"満月",last:"下弦"}[moon.phase] || "月相")
      : "";
    const moonHtml=moon
      ? `<span class="moon-phase" title="${moonName} ${moon.time} JST" aria-label="${moonName}">${moonIconSvg(moon.phase)}</span>`
      : `<span class="moon-phase"></span>`;

    btn.innerHTML=`<span class="num">${d.getDate()}</span><span class="day-meta">${holidayHtml}${moonHtml}</span><span class="dots">${hasEvent?'<i class="dot"></i>':''}</span><span class="theme-mark">${isSample?'SELF sample':''}</span>`;
    if(inMonth){
      btn.addEventListener("click",()=>{
        selectedDate=new Date(d); renderDaily(); renderCalendar(); showView("dailyView");
      });
    } else btn.disabled=true;
    cal.appendChild(btn);
  }
}
function renderDaily(){
  const d=selectedDate;
  applySeasonTheme(d.getMonth());
  $("dailyDate").textContent=`${monthNames[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`;
  $("dailyWeekday").textContent=`${weekdayNames[d.getDay()]} · ${d.getFullYear()}`;
  $("peekTheme").textContent=selectedData().today.theme;
  const timeline=$("timeline"); timeline.innerHTML="";
  for(let h=7;h<=23;h++){
    const row=document.createElement("div"); row.className="hour-row";
    row.innerHTML=`<div class="hour-label">${String(h).padStart(2,"0")}:00</div><div class="hour-space" data-hour="${h}"></div>`;
    timeline.appendChild(row);
  }
  const dayEvents=events.filter(e=>e.date===iso(d)).sort((a,b)=>a.start.localeCompare(b.start));
  dayEvents.forEach(ev=>{
    const [sh,sm]=ev.start.split(":").map(Number);
    const [eh,em]=ev.end.split(":").map(Number);
    if(sh<7||sh>23) return;
    const row=timeline.querySelector(`.hour-space[data-hour="${sh}"]`);
    if(!row) return;
    const startMin=sm;
    const dur=Math.max(30,(eh*60+em)-(sh*60+sm));
    const card=document.createElement("button");
    card.type="button"; card.className="event-card";
    card.style.top=`${(startMin/60)*74+3}px`;
    card.style.height=`${Math.max(34,(dur/60)*74-6)}px`;
    card.innerHTML=`<b>${escapeHtml(ev.title)}</b><small>${ev.start}–${ev.end}</small>`;
    card.addEventListener("click",()=>openEventModal(ev));
    row.appendChild(card);
  });
}

}

    const div=document.createElement("div"); div.className="detail";
    div.innerHTML=`<b>${label}</b><p>${escapeHtml(text)}</p>`;
    stack.appendChild(div);
  });
  if(kind==="health"){
    const h=data.health;
    const div=document.createElement("div"); div.className="healthcare";
    div.innerHTML=`<span class="card-label">TODAY'S HEALTHCARE · 今日のおすすめヘルスケア</span><div class="big">${escapeHtml(h.healthcare)}</div><p class="body-copy" style="font-size:13px;margin-top:7px">${escapeHtml(h.healthcareNote)}</p>`;
    stack.appendChild(div);
  }
  $("detailReason").textContent=cfg.reason;
  $("detailNote").textContent=data.meta.source==="ui-sample"?SAMPLE_NOTICE:"";
  showView("detailView");
}
function openEventModal(ev=null){
  $("eventModal").classList.add("open");
  $("eventModal").setAttribute("aria-hidden","false");
  $("sheetTitle").textContent=ev?"予定を編集":"予定を追加";
  $("eventId").value=ev?.id||"";
  $("eventTitle").value=ev?.title||"";
  $("eventDate").value=ev?.date||iso(selectedDate);
  $("eventStart").value=ev?.start||"10:00";
  $("eventEnd").value=ev?.end||"11:00";
  $("eventMemo").value=ev?.memo||"";
  $("deleteEvent").classList.toggle("hidden",!ev);
  setTimeout(()=>$("eventTitle").focus(),80);
}
function closeEventModal(){
  $("eventModal").classList.remove("open");
  $("eventModal").setAttribute("aria-hidden","true");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function currentSelectedOrToday(){
  return selectedDate || new Date();
}

$("prevMonth").addEventListener("click",()=>{displayMonth=new Date(displayMonth.getFullYear(),displayMonth.getMonth()-1,1);renderCalendar()});
$("nextMonth").addEventListener("click",()=>{displayMonth=new Date(displayMonth.getFullYear(),displayMonth.getMonth()+1,1);renderCalendar()});
$("openSelf").addEventListener("click",()=>{renderToday();showView("todayView")});
$("navMonth").addEventListener("click",goMonth);
$("navToday").addEventListener("click",()=>{renderToday();showView("todayView")});
$("navAdd").addEventListener("click",()=>openEventModal());
document.querySelectorAll("[data-home]").forEach(el=>{
  el.addEventListener("click",goMonth);
});
$("backToday").addEventListener("click",()=>{renderToday();showView("todayView")});
document.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>renderDetail(b.dataset.detail)));
$("closeModal").addEventListener("click",closeEventModal);
$("cancelEvent").addEventListener("click",closeEventModal);
$("eventModal").addEventListener("click",e=>{if(e.target===$("eventModal"))closeEventModal()});

$("eventForm").addEventListener("submit",e=>{
  e.preventDefault();
  const id=$("eventId").value;
  const title=$("eventTitle").value.trim();
  const date=$("eventDate").value;
  const start=$("eventStart").value,end=$("eventEnd").value,memo=$("eventMemo").value.trim();
  if(!title||!date||!start||!end)return;
  if(end<=start){alert("終了時刻は開始時刻より後にしてください。");return}
  if(id){
    const idx=events.findIndex(x=>x.id===id);
    if(idx>=0) events[idx]={...events[idx],title,date,start,end,memo};
  }else{
    events.push({id:`e_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,title,date,start,end,memo});
  }
  saveEvents();
  selectedDate=parseDateOnly(date);
  displayMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  renderCalendar(); renderDaily(); closeEventModal(); showView("dailyView");
});
$("deleteEvent").addEventListener("click",()=>{
  const id=$("eventId").value;
  if(!id)return;
  if(confirm("この予定を削除しますか？")){
    events=events.filter(x=>x.id!==id);
    saveEvents(); renderCalendar(); renderDaily(); closeEventModal();
  }
});

renderCalendar();
renderDaily();
renderToday();
</script>
</body>
