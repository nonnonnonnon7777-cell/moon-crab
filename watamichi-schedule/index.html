<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WATAMICHI MY SCHEDULE</title>
<style>
:root{
  --bg:#f8f1ec;
  --panel:#fffaf6;
  --panel-soft:#f3e7e1;
  --line:#ddcec7;
  --text:#4a3c38;
  --muted:#8d7972;
  --accent:#b79288;
  --accent-soft:#ead8d1;
  --shadow:0 10px 28px rgba(75,50,42,.07);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#fbf6f2 0%,var(--bg) 100%);
}
button,input,textarea{font:inherit}
button{color:inherit}
.app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding:28px 16px 104px;
}
.brand{
  text-align:center;
  margin-bottom:24px;
}
.brand .eyebrow{
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.18em;
  font-size:11px;
  color:var(--muted);
}
.brand h1{
  margin:8px 0 4px;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.08em;
  font-weight:500;
  font-size:24px;
}
.brand p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em;
}
.card{
  background:rgba(255,250,246,.88);
  border:1px solid rgba(221,206,199,.9);
  border-radius:26px;
  box-shadow:var(--shadow);
  padding:18px;
}
.month-head{
  display:grid;
  grid-template-columns:46px 1fr 46px;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
}
.iconbtn{
  width:44px;height:44px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#fffdfa;
  display:grid;place-items:center;
  font-size:24px;
}
.month-title{text-align:center}
.month-title .month{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  letter-spacing:.06em;
}
.month-title .year{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.18em;
  margin-top:4px;
}
.weekdays,.calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}
.weekdays div{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em;
  padding-bottom:9px;
}
.day{
  min-height:74px;
  border:0;
  border-top:1px solid #eadfd9;
  background:transparent;
  text-align:left;
  padding:7px 4px 5px;
  position:relative;
  border-radius:12px;
}
.day .num{
  display:inline-grid;
  place-items:center;
  width:27px;height:27px;
  border-radius:50%;
  font-size:12px;
}
.day.today .num{
  background:var(--accent-soft);
  color:var(--text);
  border:1px solid var(--accent);
}
.day.selected{
  background:#f5ebe6;
}
.day.outside{opacity:.28}
.event-mini{
  font-size:9px;
  line-height:1.2;
  color:#6e5c56;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
  margin-top:2px;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  display:inline-block;
  margin:5px 2px 0 3px;
}
.hint{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:14px;
}
.hidden{display:none!important}
.daily-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:18px;
}
.daily-date .big{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  letter-spacing:.04em;
}
.daily-date .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.12em;
}
.pill{
  min-height:42px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fffdfa;
}
.pill.accent{
  background:var(--accent-soft);
  border-color:transparent;
}
.timeline{
  position:relative;
  margin-top:8px;
  padding-left:58px;
}
.hour{
  height:64px;
  border-top:1px solid #e8dcd6;
  position:relative;
}
.hour span{
  position:absolute;
  left:-58px;
  top:-8px;
  color:var(--muted);
  font-size:10px;
  width:48px;
}
.event{
  position:absolute;
  left:64px;
  right:4px;
  border-radius:15px;
  padding:8px 10px;
  background:#fffdfa;
  border:1px solid var(--line);
  box-shadow:0 5px 14px rgba(77,52,44,.05);
  overflow:hidden;
  text-align:left;
}
.event strong{display:block;font-size:12px;font-weight:600}
.event small{display:block;color:var(--muted);margin-top:2px;font-size:10px}
.form-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;
  margin-bottom:4px;
}
.form-sub{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.14em;
  margin-bottom:20px;
}
.field{margin:14px 0}
.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}
.field input,.field textarea{
  width:100%;
  min-height:48px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fffdfa;
  padding:12px 13px;
  color:var(--text);
  outline:none;
  font-size:16px;
}
.field textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.msg{font-size:12px;color:#9a5e58;min-height:18px}
.nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:max(12px,env(safe-area-inset-bottom));
  width:min(calc(100% - 24px),496px);
  background:rgba(255,250,246,.95);
  backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:22px;
  padding:8px;
  box-shadow:0 12px 34px rgba(72,49,41,.12);
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
.nav button{
  min-height:48px;
  border:0;
  background:transparent;
  border-radius:16px;
  font-size:11px;
  letter-spacing:.08em;
}
.nav .plus{
  background:var(--accent-soft);
  font-size:20px;
}
@media (max-width:360px){
  .day{min-height:66px}
  .event-mini{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="eyebrow">WATAMICHI</div>
    <h1>MY SCHEDULE</h1>
    <p>自分を知る。今日を暮らす。</p>
  </header>

  <section id="monthView" class="card">
    <div class="month-head">
      <button class="iconbtn" id="prevMonth" aria-label="前の月">‹</button>
      <div class="month-title">
        <div id="monthName" class="month">September</div>
        <div id="yearName" class="year">2026</div>
      </div>
      <button class="iconbtn" id="nextMonth" aria-label="次の月">›</button>
    </div>

    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <!-- 初期表示用：JavaScriptが動かなくても2026年9月の月間カレンダーが見える -->
    <div id="calendar" class="calendar">
      <button class="day outside" type="button"><span class="num">30</span></button>
      <button class="day outside" type="button"><span class="num">31</span></button>
      <button class="day" type="button" data-date="2026-09-01"><span class="num">1</span></button>
      <button class="day" type="button" data-date="2026-09-02"><span class="num">2</span></button>
      <button class="day" type="button" data-date="2026-09-03"><span class="num">3</span></button>
      <button class="day" type="button" data-date="2026-09-04"><span class="num">4</span></button>
      <button class="day today" type="button" data-date="2026-09-05"><span class="num">5</span></button>

      <button class="day" type="button" data-date="2026-09-06"><span class="num">6</span></button>
      <button class="day" type="button" data-date="2026-09-07"><span class="num">7</span></button>
      <button class="day" type="button" data-date="2026-09-08"><span class="num">8</span></button>
      <button class="day" type="button" data-date="2026-09-09"><span class="num">9</span></button>
      <button class="day" type="button" data-date="2026-09-10"><span class="num">10</span></button>
      <button class="day" type="button" data-date="2026-09-11"><span class="num">11</span></button>
      <button class="day" type="button" data-date="2026-09-12"><span class="num">12</span></button>

      <button class="day" type="button" data-date="2026-09-13"><span class="num">13</span></button>
      <button class="day" type="button" data-date="2026-09-14"><span class="num">14</span></button>
      <button class="day" type="button" data-date="2026-09-15"><span class="num">15</span></button>
      <button class="day" type="button" data-date="2026-09-16"><span class="num">16</span></button>
      <button class="day" type="button" data-date="2026-09-17"><span class="num">17</span></button>
      <button class="day" type="button" data-date="2026-09-18"><span class="num">18</span></button>
      <button class="day" type="button" data-date="2026-09-19"><span class="num">19</span></button>

      <button class="day" type="button" data-date="2026-09-20"><span class="num">20</span></button>
      <button class="day" type="button" data-date="2026-09-21"><span class="num">21</span></button>
      <button class="day" type="button" data-date="2026-09-22"><span class="num">22</span></button>
      <button class="day" type="button" data-date="2026-09-23"><span class="num">23</span></button>
      <button class="day" type="button" data-date="2026-09-24"><span class="num">24</span></button>
      <button class="day" type="button" data-date="2026-09-25"><span class="num">25</span></button>
      <button class="day" type="button" data-date="2026-09-26"><span class="num">26</span></button>

      <button class="day" type="button" data-date="2026-09-27"><span class="num">27</span></button>
      <button class="day" type="button" data-date="2026-09-28"><span class="num">28</span></button>
      <button class="day" type="button" data-date="2026-09-29"><span class="num">29</span></button>
      <button class="day" type="button" data-date="2026-09-30"><span class="num">30</span></button>
      <button class="day outside" type="button"><span class="num">1</span></button>
      <button class="day outside" type="button"><span class="num">2</span></button>
      <button class="day outside" type="button"><span class="num">3</span></button>
    </div>

    <div class="hint">日付をタップすると、その日のスケジュールが開きます。</div>
  </section>

  <section id="dailyView" class="card hidden">
    <div class="daily-header">
      <div class="daily-date">
        <div id="dailyBig" class="big"></div>
        <div id="dailySub" class="sub"></div>
      </div>
      <button class="pill accent" id="addTop">＋ 予定</button>
    </div>
    <div id="timeline" class="timeline"></div>
  </section>

  <section id="editView" class="card hidden">
    <div id="editTitle" class="form-title">予定を追加</div>
    <div class="form-sub">SCHEDULE EDIT</div>
    <form id="eventForm">
      <div class="field">
        <label for="title">予定名</label>
        <input id="title" maxlength="60" required placeholder="例：打ち合わせ">
      </div>
      <div class="field">
        <label for="date">日付</label>
        <input id="date" type="date" required>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="start">開始</label>
          <input id="start" type="time" required>
        </div>
        <div class="field">
          <label for="end">終了</label>
          <input id="end" type="time" required>
        </div>
      </div>
      <div class="field">
        <label for="memo">メモ</label>
        <textarea id="memo" maxlength="300" placeholder="必要ならメモを入力"></textarea>
      </div>
      <div id="msg" class="msg"></div>
      <div class="actions">
        <button class="pill accent" type="submit">保存</button>
        <button class="pill" id="cancel" type="button">キャンセル</button>
        <button class="pill hidden" id="deleteBtn" type="button">削除</button>
      </div>
    </form>
  </section>
</div>

<nav class="nav" aria-label="ナビゲーション">
  <button id="navMonth">MONTH</button>
  <button id="navToday">TODAY</button>
  <button class="plus" id="navAdd" aria-label="予定を追加">＋</button>
</nav>

<script>
const KEY='watamichi-schedule-v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dateKey=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parseKey=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m,d};};
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let events=[];
try{events=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){events=[]}
if(!Array.isArray(events)) events=[];

const now=new Date();
let currentYear=now.getFullYear();
let currentMonth=now.getMonth();
let selected=dateKey(now.getFullYear(),now.getMonth()+1,now.getDate());
let editingId=null;

function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function show(which){
  $('#monthView').classList.toggle('hidden',which!=='month');
  $('#dailyView').classList.toggle('hidden',which!=='daily');
  $('#editView').classList.toggle('hidden',which!=='edit');
}
function weekdayUTC(y,m,d){return new Date(Date.UTC(y,m-1,d)).getUTCDay()}

function renderMonth(){
  $('#monthName').textContent=months[currentMonth];
  $('#yearName').textContent=currentYear;
  const cal=$('#calendar');
  cal.innerHTML='';

  const firstDay=new Date(Date.UTC(currentYear,currentMonth,1)).getUTCDay();
  const daysIn=new Date(Date.UTC(currentYear,currentMonth+1,0)).getUTCDate();
  const prevDays=new Date(Date.UTC(currentYear,currentMonth,0)).getUTCDate();
  const today=dateKey(now.getFullYear(),now.getMonth()+1,now.getDate());

  for(let i=0;i<42;i++){
    let y=currentYear,m=currentMonth+1,d=i-firstDay+1,out=false;
    if(d<1){
      out=true;
      m=currentMonth===0?12:currentMonth;
      y=currentMonth===0?currentYear-1:currentYear;
      d=prevDays+d;
    }else if(d>daysIn){
      out=true;
      d-=daysIn;
      m=currentMonth===11?1:currentMonth+2;
      y=currentMonth===11?currentYear+1:currentYear;
    }
    const key=dateKey(y,m,d);
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='day'+(out?' outside':'')+(key===today?' today':'')+(key===selected?' selected':'');
    btn.setAttribute('aria-label',`${y}年${m}月${d}日`);
    const num=document.createElement('span');
    num.className='num';
    num.textContent=d;
    btn.appendChild(num);

    const ev=events.filter(e=>e.date===key).sort((a,b)=>a.start.localeCompare(b.start));
    ev.slice(0,2).forEach(e=>{
      const span=document.createElement('span');
      span.className='event-mini';
      span.textContent=e.title;
      btn.appendChild(span);
    });
    if(ev.length){
      const dot=document.createElement('span');
      dot.className='dot';
      btn.appendChild(dot);
    }

    btn.addEventListener('click',()=>{
      selected=key;
      renderDaily();
      show('daily');
    });
    cal.appendChild(btn);
  }
}

function renderDaily(){
  const {y,m,d}=parseKey(selected);
  const w=weekdayUTC(y,m,d);
  $('#dailyBig').textContent=`${months[m-1]} ${pad(d)}`;
  $('#dailySub').textContent=`${weekdays[w]} · ${y}`;
  const t=$('#timeline');
  t.innerHTML='';

  for(let h=7;h<=23;h++){
    const row=document.createElement('div');
    row.className='hour';
    row.innerHTML=`<span>${pad(h)}:00</span>`;
    t.appendChild(row);
  }

  const startBase=7*60;
  events.filter(e=>e.date===selected).sort((a,b)=>a.start.localeCompare(b.start)).forEach(e=>{
    const top=Math.max(0,(mins(e.start)-startBase)/60*64);
    const duration=Math.max(30,mins(e.end)-mins(e.start));
    const height=Math.max(40,duration/60*64-4);

    const b=document.createElement('button');
    b.type='button';
    b.className='event';
    b.style.top=(top+4)+'px';
    b.style.height=height+'px';

    const strong=document.createElement('strong');
    strong.textContent=e.title;
    const small=document.createElement('small');
    small.textContent=`${e.start} – ${e.end}`;
    b.append(strong,small);

    b.addEventListener('click',()=>openEdit(e));
    t.appendChild(b);
  });
}

function openEdit(ev=null){
  editingId=ev?ev.id:null;
  $('#editTitle').textContent=ev?'予定を編集':'予定を追加';
  $('#title').value=ev?.title||'';
  $('#date').value=ev?.date||selected;
  $('#start').value=ev?.start||'09:00';
  $('#end').value=ev?.end||'10:00';
  $('#memo').value=ev?.memo||'';
  $('#deleteBtn').classList.toggle('hidden',!ev);
  $('#msg').textContent='';
  show('edit');
}

$('#eventForm').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('#title').value.trim();
  const date=$('#date').value;
  const start=$('#start').value;
  const end=$('#end').value;
  const memo=$('#memo').value.trim();

  if(!title||!date||!start||!end){
    $('#msg').textContent='必須項目を入力してください。';
    return;
  }
  if(mins(end)<=mins(start)){
    $('#msg').textContent='終了時間は開始時間より後にしてください。';
    return;
  }

  if(editingId){
    const i=events.findIndex(e=>e.id===editingId);
    if(i>=0) events[i]={...events[i],title,date,start,end,memo};
  }else{
    events.push({
      id:'e'+Date.now()+Math.random().toString(36).slice(2),
      title,date,start,end,memo
    });
  }

  save();
  selected=date;
  const p=parseKey(date);
  currentYear=p.y;
  currentMonth=p.m-1;
  renderMonth();
  renderDaily();
  show('daily');
});

$('#deleteBtn').addEventListener('click',()=>{
  if(!editingId)return;
  events=events.filter(e=>e.id!==editingId);
  save();
  renderMonth();
  renderDaily();
  show('daily');
});

$('#cancel').addEventListener('click',()=>{renderDaily();show('daily')});
$('#addTop').addEventListener('click',()=>openEdit());
$('#navAdd').addEventListener('click',()=>openEdit());

$('#navMonth').addEventListener('click',()=>{
  const p=parseKey(selected);
  currentYear=p.y;
  currentMonth=p.m-1;
  renderMonth();
  show('month');
});

$('#navToday').addEventListener('click',()=>{
  selected=dateKey(now.getFullYear(),now.getMonth()+1,now.getDate());
  currentYear=now.getFullYear();
  currentMonth=now.getMonth();
  renderDaily();
  show('daily');
});

$('#prevMonth').addEventListener('click',()=>{
  currentMonth--;
  if(currentMonth<0){currentMonth=11;currentYear--}
  renderMonth();
});

$('#nextMonth').addEventListener('click',()=>{
  currentMonth++;
  if(currentMonth>11){currentMonth=0;currentYear++}
  renderMonth();
});

// 初期HTML上にある2026年9月の日付も、JS実行前後どちらでもタップ可能にする
document.querySelectorAll('#calendar [data-date]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    selected=btn.dataset.date;
    renderDaily();
    show('daily');
  });
});

// JavaScriptが動けば現在月を再描画
renderMonth();
show('month');
</script>
</body>
</html>
